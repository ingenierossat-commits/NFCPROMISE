<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pinky Promise · Enlace NFC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d0808;
    --ink-soft:#161010;
    --rose1:#e8c4b8;
    --rose2:#c99a86;
    --rose3:#9c7568;
    --cream:#f6ece6;
    --line: rgba(232,196,184,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 50% -10%, #241715 0%, var(--ink) 55%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    font-family:'Jost', sans-serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    width:100%;
    max-width:400px;
    min-height:100vh;
    padding:38px 26px 34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }

  /* --- signature: pulsing tap ring behind the crest, echoing the NFC touch that got them here --- */
  .tap-ring{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:230px;
    height:230px;
    border-radius:50%;
    border:1px solid var(--line);
    animation: pulse 3.2s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform:translateX(-50%) scale(0.72); opacity:0; }
    12%{ opacity:.55; }
    70%{ opacity:0; }
    100%{ transform:translateX(-50%) scale(1.05); opacity:0; }
  }

  .crest{
    width:170px;height:170px;
    margin-top:12px;
    position:relative;
    z-index:2;
  }
  .crest svg{width:100%;height:100%;}

  .brand{
    margin-top:18px;
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:30px;
    letter-spacing:.5px;
    color:var(--cream);
    position:relative;
    z-index:2;
  }
  .brand em{ font-style:italic; color:var(--rose1); }
  .sub{
    margin-top:2px;
    font-size:10.5px;
    letter-spacing:4px;
    color:var(--rose3);
    text-transform:uppercase;
  }

  .greeting{
    margin-top:26px;
    text-align:center;
    font-size:14px;
    line-height:1.6;
    color:rgba(246,236,230,0.75);
    max-width:280px;
  }
  .greeting b{ color:var(--rose1); font-weight:500; }

  nav{
    margin-top:26px;
    width:100%;
    display:flex;
    flex-direction:column;
  }
  .item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:17px 4px;
    border-bottom:1px solid var(--line);
    text-decoration:none;
    color:var(--cream);
  }
  nav .item:first-child{ border-top:1px solid var(--line); }
  .icon{
    width:34px;height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .icon svg{ width:16px;height:16px; stroke:var(--rose1); fill:none; }
  .item-txt{ flex:1; }
  .item-title{ font-size:15px; font-family:'Cormorant Garamond', serif; font-weight:600; }
  .item-desc{ font-size:11px; color:rgba(246,236,230,0.5); margin-top:1px; }
  .chev{ color:var(--rose3); font-size:15px; }

  footer{
    margin-top:auto;
    padding-top:30px;
    text-align:center;
  }
  .foot-note{
    font-size:9.5px;
    letter-spacing:1px;
    color:rgba(246,236,230,0.28);
  }
</style>
</head>

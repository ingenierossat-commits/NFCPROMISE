<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EncuentraMiCoche">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ICONS/icon192.png">
<title>EncuentraMiCoche</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d0d;
  --ink:#f0ede6;
  --ink2:#8a8a8a;
  --ink3:#2a2a28;
  --paper:#161614;
  --paper2:#1e1e1b;
  --amber:#e8a030;
  --red:#e05555;
  --green:#4caf7d;
  --r:12px;
  --mono:'IBM Plex Mono', monospace;
  --sans:'IBM Plex Sans', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100%;
  display:flex;
  flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ---- pantalla usuario ---- */
#user-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:2000;padding:20px;
}
.user-box{
  background:var(--paper);
  border:1px solid var(--ink3);
  border-radius:var(--r);
  padding:28px 24px;
  width:100%;max-width:360px;
}
.user-box h2{
  font-family:var(--mono);
  font-size:14px;letter-spacing:3px;
  color:var(--amber);
  text-transform:uppercase;
  margin-bottom:6px;
}
.user-box p{
  font-size:12.5px;color:var(--ink2);
  margin-bottom:18px;line-height:1.5;
}
.user-box input{
  width:100%;background:var(--paper2);
  border:1px solid var(--ink3);border-radius:8px;
  color:var(--ink);padding:12px 14px;
  font-family:var(--sans);font-size:14px;
  margin-bottom:12px;
}
.user-box input:focus{outline:none;border-color:var(--amber);}
.user-box button{
  width:100%;padding:12px;border:none;border-radius:8px;
  background:var(--amber);color:#0d0d0d;
  font-weight:600;font-size:14px;cursor:pointer;
}

/* ---- header ---- */
.hdr{
  padding:22px 20px 16px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--ink3);
}
.hdr-pin{
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--amber);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.hdr-title{
  font-family:var(--mono);font-size:14px;
  letter-spacing:2.5px;color:var(--ink);
  text-transform:uppercase;
}
.hdr-user{
  margin-left:auto;font-family:var(--mono);
  font-size:11px;color:var(--ink2);
  background:none;border:none;cursor:pointer;
  text-decoration:underline;
}

/* ---- main ---- */
.main{
  flex:1;padding:26px 20px 40px;
  max-width:480px;width:100%;margin:0 auto;
}

.status-card{
  background:var(--paper);
  border:1px solid var(--ink3);
  border-radius:var(--r);
  padding:22px 20px;
  margin-bottom:18px;
}
.status-empty{
  text-align:center;color:var(--ink2);
  font-size:13px;line-height:1.6;padding:10px 0;
}
.status-time{
  font-family:var(--mono);
  font-size:26px;color:var(--amber);
  margin-bottom:4px;
}
.status-sub{
  font-size:12px;color:var(--ink2);
  margin-bottom:16px;
}
.status-note{
  font-size:13px;color:var(--ink);
  background:var(--paper2);
  border-radius:8px;padding:10px 12px;
  margin-bottom:16px;
  display:none;
}

.btn-primary{
  width:100%;padding:16px;border:none;border-radius:10px;
  background:var(--amber);color:#0d0d0d;
  font-family:var(--sans);font-weight:600;font-size:15px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:10px;
}
.btn-primary:active{opacity:.85;}
.btn-secondary{
  width:100%;padding:14px;border:1px solid var(--ink3);border-radius:10px;
  background:var(--paper2);color:var(--ink);
  font-family:var(--sans);font-weight:500;font-size:14px;
  cursor:pointer;margin-bottom:10px;
}
.btn-danger{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:transparent;color:var(--red);
  font-family:var(--sans);font-size:13px;
  cursor:pointer;
}

.field-note{
  width:100%;background:var(--paper2);
  border:1px solid var(--ink3);border-radius:8px;
  color:var(--ink);padding:11px 13px;
  font-family:var(--sans);font-size:13px;
  margin-bottom:12px;
}
.field-note:focus{outline:none;border-color:var(--amber);}

.timer-row{
  display:flex;align-items:center;gap:10px;
  background:var(--paper2);border-radius:8px;
  padding:10px 12px;margin-bottom:14px;
  font-size:12.5px;color:var(--ink2);
}
.timer-row select{
  background:var(--paper);border:1px solid var(--ink3);
  color:var(--ink);border-radius:6px;padding:6px 8px;
  font-family:var(--sans);font-size:12.5px;
}
.timer-active{
  color:var(--green);font-family:var(--mono);font-size:12px;
  margin-top:4px;
}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--paper2);border:1px solid var(--ink3);
  color:var(--ink);padding:12px 20px;border-radius:10px;
  font-size:13px;z-index:3000;opacity:0;pointer-events:none;
  transition:opacity .25s;max-width:90%;text-align:center;
}
.toast.show{opacity:1;}
.toast.err{border-color:var(--red);color:var(--red);}
.toast.ok{border-color:var(--green);color:var(--green);}

.footer-note{
  text-align:center;font-size:10.5px;color:var(--ink3);
  margin-top:18px;font-family:var(--mono);letter-spacing:1px;
}
</style>
</head>
<body>

<div id="user-screen">
  <div class="user-box">
    <h2>EncuentraMiCoche</h2>
    <p>Escribe tu nombre para guardar tu ubicación de forma privada.</p>
    <input type="text" id="inputNombre" placeholder="Tu nombre" autocomplete="off">
    <button onclick="entrar()">Entrar</button>
  </div>
</div>

<div class="hdr">
  <div class="hdr-pin">📍</div>
  <div class="hdr-title">EncuentraMiCoche</div>
  <button class="hdr-user" id="hdrUser" onclick="cambiarUsuario()"></button>
</div>

<div class="main">

  <div class="status-card" id="statusCard">
    <div class="status-empty" id="statusEmpty">
      Aún no has guardado dónde has aparcado.
    </div>
    <div id="statusFilled" style="display:none;">
      <div class="status-time" id="statusTime">—</div>
      <div class="status-sub" id="statusSub">—</div>
      <div class="status-note" id="statusNote"></div>
    </div>
  </div>

  <input type="text" class="field-note" id="fieldNota" placeholder="Nombre de esta ubicación (ej: parking Corte Inglés)" style="display:none;">

  <button class="btn-primary" id="btnGuardar" onclick="guardarUbicacion()">📍 Aparqué aquí</button>
  <button class="btn-secondary" id="btnVolver" style="display:none;" onclick="comoVolver()">🧭 Cómo volver</button>
  <button class="btn-danger" id="btnBorrar" style="display:none;" onclick="borrarUbicacion()">Borrar ubicación guardada</button>

  <div class="footer-note">DATOS PRIVADOS · SOLO TÚ LOS VES</div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
